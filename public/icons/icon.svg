  <rect x="248" y="350" width="16" height="60" fill="#818cf8"/>
  <rect x="206" y="400" width="100" height="16" rx="8" fill="#818cf8"/>
  <!-- Sound waves -->
  <path d="M 370 180 Q 395 256 370 332" fill="none" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M 400 160 Q 435 256 400 352" fill="none" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
  <path d="M 142 180 Q 117 256 142 332" fill="none" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M 112 160 Q 77 256 112 352" fill="none" stroke="#a78bfa" stroke-width="8" stroke-linecap="round" opacity="0.5"/>
</svg>
